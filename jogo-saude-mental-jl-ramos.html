 no:[["Ajudo agora e adianto minhas pendências em casa, à noite.","Levar trabalho para casa parece solução, mas rouba seu descanso. Combinar prazos é mais sustentável."],["Digo que não posso e deixo ela se virar. Hoje o dia é meu.","Recusar sem conversar deixa a colega sozinha. Dá para dizer não e combinar um horário."]]},
{n:"CONTÁBIL",c:"Você percebeu um erro seu num lançamento que já tinha sido conferido. Ninguém notou ainda.",
 ok:["Aviso a equipe, corrijo o lançamento e ajusto meu processo.","Assumir o erro com calma cria confiança e segurança psicológica no time."],
 no:[["Corrijo em silêncio, sem alarde, para não preocupar ninguém.","Corrigir calado(a) esconde o erro de quem conferiu e impede o time de aprender junto."],["Espero alguém perceber. Se perguntarem, eu explico.","Esperar ser descoberto(a) aumenta a ansiedade e o risco. Avisar primeiro gera confiança."]]},
{n:"FISCAL",c:"Dia de vencimento de impostos. O prazo aperta e um colega responde de forma ríspida com você.",
 ok:["Respiro, não levo para o pessoal e converso depois do prazo.","Pausar e conversar depois, com respeito, protege a relação e a saúde mental dos dois."],
 no:[["Deixo passar e engulo o incômodo para evitar briga.","Engolir o incômodo não resolve, ele volta como mágoa. Conversar depois do prazo é melhor."],["Respondo firme na hora, para ele saber que passou do limite.","Responder no calor do prazo costuma piorar tudo. Melhor conversar com calma depois."]]},
{n:"SOCIETÁRIO",c:"Você está travado(a) num processo e tem medo de parecer incompetente.",
 ok:["Peço ajuda a um colega mais experiente e aprendo com ele.","Pedir ajuda é sinal de maturidade e fortalece o aprendizado de todo mundo."],
 no:[["Pesquiso por conta própria até resolver, mesmo que demore.","Pesquisar é bom, mas ficar sozinho(a) por muito tempo gera estresse e atraso. Pedir ajuda abrevia."],["Aviso que está difícil, mas espero alguém me procurar.","Avisar é bom, mas esperar ser procurado(a) deixa o problema parado. Peça ajuda diretamente."]]},
{n:"CONTÁBIL",c:"Fechamento do mês. Você está esgotado(a), com a cabeça a mil e sem render.",
 ok:["Faço uma pausa curta, respiro e reorganizo as prioridades.","Pausas curtas devolvem o foco e ajudam a render melhor sem adoecer."],
 no:[["Sigo firme até o fim do dia e descanso só no fim de semana.","Empurrar o descanso piora o foco e o humor. Pausas curtas ajudam a render melhor."],["Desabafo com a equipe sobre como o mês está pesado.","Desabafar faz bem, mas sem pausa nem plano o cansaço continua. Organizar também faz parte."]]},
{n:"ESCRITÓRIO TODO",c:"Para ganhar espaço, um colega bajula a liderança e leva o crédito pelo trabalho dos outros. Você percebe a injustiça.",
 ok:["Mostro meu trabalho com clareza e transparência, sem entrar no jogo.","Mostrar seu trabalho com honestidade protege você e mantém o ambiente justo."],
 no:[["Sigo em silêncio e confio que alguém um dia vai notar.","Esperar ser notado(a) nem sempre funciona. Mostrar seu trabalho não é jogo político."],["Passo a elogiar a liderança também, para não ficar atrás.","Entrar no jogo gera desconfiança e desgaste. Resultados honestos constroem respeito."]]},
{n:"ESCRITÓRIO TODO",c:"No cafezinho, comentam a vida pessoal de um colega que não está ali e pedem a sua opinião.",
 ok:["Não alimento a conversa e mudo de assunto com educação.","Cortar a fofoca protege quem não está presente e mostra que o time pode confiar em você."],
 no:[["Escuto em silêncio, sem comentar, só para não ficar de fora.","Ficar só ouvindo também sustenta a fofoca. Mudar de assunto protege quem não está lá."],["Participo só um pouquinho, afinal é uma conversa leve.","Fofoca parece leve, mas machuca e vira intriga. Quem fala de um, fala de qualquer um."]]},
{n:"ESCRITÓRIO TODO",c:"Um grupo sempre almoça junto e deixa de fora uma colega que entrou há pouco tempo.",
 ok:["Convido a colega para almoçar com a gente, hoje mesmo.","Incluir faz a pessoa se sentir parte. O acolhimento começa com um convite."],
 no:[["Cumprimento ela com simpatia, mas sigo com o meu grupo.","Ser simpático(a) é bom, mas só isso não inclui. O convite faz a pessoa se sentir parte."],["Sugiro que ela convide o pessoal do setor dela.","Empurrar a iniciativa para ela mantém a exclusão. Quem já está no grupo pode dar o primeiro passo."]]},
{n:"ESCRITÓRIO TODO",c:"A semana está pesada e a conversa da equipe virou só reclamação, todos os dias.",
 ok:["Reconheço o cansaço e levo sugestões do que dá para melhorar.","Acolher o cansaço e propor soluções transforma a reclamação em movimento positivo."],
 no:[["Concordo com o grupo, só para manter o clima de equipe.","Concordar com tudo reforça a negatividade. Dá para fazer parte do grupo e propor melhorias."],["Peço para pararem de reclamar, porque isso me desgasta.","Cortar o desabafo dos outros gera atrito. Acolher o cansaço e propor soluções funciona melhor."]]},
{n:"ESCRITÓRIO TODO",c:"O prazo da equipe está em risco e cada um cuida só da sua parte. Você já terminou a sua.",
 ok:["Ofereço ajuda e combino com o time quem pode apoiar.","Colaborar divide o peso, reduz o estresse e faz o time inteiro chegar junto."],
 no:[["Aviso a liderança do risco e espero orientação.","Avisar a liderança é válido, mas antes vale conversar e oferecer ajuda ao time."],["Entrego a minha parte e aproveito para adiantar outras tarefas.","Adiantar o que é seu é bom, mas o resultado é de todos. Ajudar divide o peso."]]}

function start(){fase=0;coins=0;tela()}
function tela(){
 document.body.classList.add('home-on');
 app.innerHTML='<div class="home"><div class="h-top"><img class="logo2" src="'+LOGO+'" alt="JL Ramos Contabilidade Digital"></div>'+
 '<div class="h-body"><h1 class="h-title px"><span class="t1">SAÚDE MENTAL</span><span class="t2">COMEÇA COM A GENTE</span></h1>'+
 '<div class="h-row"><img class="jota2" src="'+P.hello+'" alt="Jota, o mascote da JL Ramos"><div class="bub">Oi! Eu sou o <b class="gd">Jota</b>.<br>Me ajude a construir um <b>ambiente de trabalho melhor</b>!</div></div>'+
 '<button class="gbtn" id="go">▶ START</button>'+
 '<p class="h-tag"><span class="ln"></span><span>Mais que números, <b class="gd">parceiros</b> no seu crescimento.</span><span class="ln"></span></p></div><div class="h-bot"></div></div>';
 document.getElementById('go').onclick=function(){beep(660,.1);level()}}
function level(){
 document.body.classList.remove('home-on');
 busy=false;var f=F[fase];
 var ops=[{t:f.ok[0],c:1,m:f.ok[1]}].concat(f.no.map(function(x){return{t:x[0],c:0,m:x[1]}})).sort(function(){return Math.random()-.5});
 var map=F.map(function(x,i){return '<i class="'+(i<fase?'done':i==fase?'cur':'')+'">'+(i<fase?'✓':i+1)+'</i>'}).join('<b></b>');
 app.innerHTML='<div class="hud px"><span>🪙 '+coins+'</span><span>FASE '+(fase+1)+'-'+F.length+'</span></div><div class="map" aria-hidden="true">'+map+'</div>'+
 '<div class="panel say"><span class="px tag">'+f.n+'</span><p>'+f.c+'</p><p>Qual é a atitude correta? Bata no bloco!</p></div>'+
 '<div class="scene" id="sc"><div class="hills"></div><span class="cl" style="top:215px;left:5%;animation-duration:15s">☁️</span><span class="cl" style="top:245px;right:12%;animation-duration:21s">☁️</span><div class="blocks">'+
 ops.map(function(o,i){return '<button class="blk" data-i="'+i+'">'+o.t+'</button>'}).join('')+
 '</div><div class="hero" id="hero"><span><img id="jimg" src="'+P.think+'" alt="Jota"></span></div><div class="flag" id="flag">🏁</div><div class="ground"></div></div><div id="fb"></div>';
 var bs=document.querySelectorAll('.blk');
 bs.forEach(function(b,i){b.onclick=function(){pick(i,ops,bs)}});
}
function burst(sc,b){var E=['🪙','✨','⭐'];for(var k=0;k<7;k++){var c=document.createElement('span');c.className='coin';c.textContent=k==0?'🪙':E[k%3];c.style.left=(b.offsetLeft+b.offsetWidth/2-15)+'px';c.style.top=(b.offsetTop+b.offsetHeight)+'px';c.style.setProperty('--dx',(Math.random()*140-70)+'px');c.style.animationDelay=(k*.05)+'s';sc.appendChild(c)}var p=document.createElement('span');p.className='plus px';p.textContent='+100';p.style.left=(b.offsetLeft+b.offsetWidth/2-24)+'px';p.style.top=(b.offsetTop+b.offsetHeight-8)+'px';sc.appendChild(p)}

function pose(n){var j=document.getElementById('jimg');if(j)j.src=P[n]}
function pick(i,ops,bs){
 if(busy)return;busy=true;bs.forEach(function(b){b.disabled=true});
 var hero=document.getElementById('hero'),o=ops[i],b=bs[i],fb=document.getElementById('fb'),sc=document.getElementById('sc');

 setTimeout(function(){hero.classList.remove('run');pose('jump');hero.classList.add('jump')},660);
 setTimeout(function(){
  b.classList.add('hit');
  if(o.c){
   b.classList.add('ok');coins+=100;setTimeout(function(){pose('ok')},350);
   burst(sc,b);
   beep(988,.08);setTimeout(function(){beep(1319,.3)},80);
